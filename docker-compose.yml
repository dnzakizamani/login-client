version: '3.8'

services:
  app:
    build: .
    container_name: dash-app
    restart: unless-stopped
    networks:
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy
    depends_on:
      - app

networks:
  caddy:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: